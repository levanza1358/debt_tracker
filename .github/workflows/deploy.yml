name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ganti ke branch utama Anda
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'

    - name: Enable web
      run: flutter config --enable-web

    - name: Get dependencies
      run: flutter pub get

    - name: Build web
      run: >
        flutter build web --release
        --base-href "/${{ github.event.repository.name }}/"
        --dart-define TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
        --dart-define TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
        --dart-define DELETE_PIN="${{ secrets.DELETE_PIN }}"

    - name: Copy additional files
      run: |
        cp web/manifest.json build/web/
        cp -r web/icons/* build/web/icons/
        cp web/favicon.png build/web/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web
